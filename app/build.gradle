plugins {
  id 'com.android.application'
}

android {
  namespace 'ai.phonecluster.stand'
  compileSdk 36

  defaultConfig {
    applicationId 'ai.phonecluster.stand'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '0.1.0'
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  packagingOptions {
    jniLibs {
      useLegacyPackaging = true
    }
  }
}
