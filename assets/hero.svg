<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Phone Cluster</title>
  <desc id="desc">Two Android phones connected locally for split LLM inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="0.55" stop-color="#0a1019"/>
      <stop offset="1" stop-color="#101927"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ff3d"/>
      <stop offset="1" stop-color="#55d7ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111d2b"/>
      <stop offset="1" stop-color="#0a111a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#203044" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1080" cy="60" r="210" fill="#b8ff3d" opacity="0.035"/>
  <circle cx="90" cy="520" r="220" fill="#55d7ff" opacity="0.035"/>

  <g transform="translate(66 54)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#b8ff3d" opacity="0.12" stroke="#b8ff3d" stroke-opacity="0.35"/>
    <text x="55" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2.2" fill="#b8ff3d">OPEN STAND</text>
    <text x="0" y="78" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.8" fill="#f4f7f2">PHONE CLUSTER</text>
    <text x="2" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" letter-spacing="2.4" fill="#8c99a9">ONE MODEL / TWO PHONES / ZERO CLOUD</text>
  </g>

  <g transform="translate(96 210)">
    <rect x="0" y="0" width="298" height="252" rx="34" fill="#0b121c" stroke="#304157" stroke-width="2"/>
    <rect x="16" y="18" width="266" height="35" rx="17" fill="#111d2b"/>
    <circle cx="40" cy="35.5" r="4" fill="#55d7ff"/>
    <text x="54" y="40" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9" letter-spacing="1.4">MODEL PHONE</text>
    <text x="256" y="40" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#55d7ff">ONLINE</text>
    <rect x="16" y="68" width="266" height="78" rx="16" fill="#101927" stroke="#263345"/>
    <text x="32" y="92" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9" letter-spacing="1.2">PROMPT</text>
    <text x="32" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f4f7f2">Explain local inference</text>
    <rect x="16" y="158" width="194" height="54" rx="14" fill="#b8ff3d" opacity="0.94"/>
    <text x="32" y="181" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#07100a">MODEL WEIGHTS + CHAT UI</text>
    <text x="32" y="198" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#314819">llama-server / localhost:8080</text>
    <text x="16" y="236" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9">one GGUF / private storage</text>
  </g>

  <g transform="translate(806 210)">
    <rect x="0" y="0" width="298" height="252" rx="34" fill="#0b121c" stroke="#304157" stroke-width="2"/>
    <rect x="16" y="18" width="266" height="35" rx="17" fill="#111d2b"/>
    <circle cx="40" cy="35.5" r="4" fill="#b8ff3d"/>
    <text x="54" y="40" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9" letter-spacing="1.4">COMPUTE NODE</text>
    <text x="256" y="40" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#b8ff3d">READY</text>
    <g transform="translate(16 68)">
      <rect width="266" height="78" rx="16" fill="#101927" stroke="#263345"/>
      <g fill="#55d7ff" opacity="0.65">
        <rect x="18" y="18" width="22" height="22" rx="5"/>
        <rect x="48" y="18" width="22" height="22" rx="5"/>
        <rect x="78" y="18" width="22" height="22" rx="5"/>
        <rect x="18" y="48" width="22" height="22" rx="5"/>
        <rect x="48" y="48" width="22" height="22" rx="5"/>
        <rect x="78" y="48" width="22" height="22" rx="5"/>
      </g>
      <path d="M118 40 H158" stroke="#b8ff3d" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M158 40 L150 35 M158 40 L150 45" stroke="#b8ff3d" stroke-width="2"/>
      <text x="172" y="38" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9">tensor work</text>
      <text x="172" y="55" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9">CPU backend</text>
    </g>
    <rect x="16" y="158" width="210" height="54" rx="14" fill="#101927" stroke="#55d7ff" stroke-opacity="0.5"/>
    <text x="32" y="181" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#55d7ff">NO MODEL REQUIRED</text>
    <text x="32" y="198" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9">ggml-rpc-server / 0.0.0.0:50053</text>
    <text x="16" y="236" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9">same local network / no cloud</text>
  </g>

  <g transform="translate(466 290)">
    <rect x="0" y="0" width="268" height="92" rx="46" fill="#0a111a" stroke="#b8ff3d" stroke-opacity="0.55"/>
    <text x="134" y="34" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#b8ff3d" letter-spacing="1.6">LOCAL LINK</text>
    <text x="134" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#f4f7f2">ggml-rpc</text>
    <text x="134" y="76" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#8c99a9">host:port / trusted LAN</text>
    <path d="M-22 46 H-4 M292 46 H274" stroke="#b8ff3d" stroke-width="2" opacity="0.7"/>
  </g>

  <g transform="translate(96 512)">
    <g font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#8c99a9" letter-spacing="1.2">
      <text x="0" y="0">ANDROID 8+</text>
      <text x="120" y="0">LLAMA.CPP</text>
      <text x="236" y="0">STANDARD RPC</text>
      <text x="386" y="0">NO ACCOUNT</text>
      <text x="516" y="0">NO TELEMETRY</text>
      <text x="666" y="0">MIT</text>
    </g>
    <text x="1008" y="0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b8ff3d" font-weight="700" letter-spacing="1.4">MEASURE IT. THEN REPEAT IT.</text>
  </g>
</svg>
